name = "speed"
main = "src/entry-v1.3.js"
compatibility_date = "2026-07-28"

[build]
command = "node scripts/write-build-meta.mjs"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "CURATOR_SPEED_RECORDS"
id = "6de4740a91b94f9a945ce12a9f5a2208"

[[kv_namespaces]]
binding = "CURATOR_ERROR_RECORDS"
id = "447306da3a754b44830d2ac8608322c0"

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
crons = ["37 * * * *"]

[observability]
enabled = true
